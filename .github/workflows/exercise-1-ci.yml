name: Exercise 1 CI

on:
  pull_request:
    paths:
      - "exercise-1/**"
      - ".github/workflows/exercise-1-ci.yml"
  push:
    branches: [main]
    paths:
      - "exercise-1/**"
      - ".github/workflows/exercise-1-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercise-1/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exercise-1/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercise-1/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exercise-1/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercise-1
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with the README command
        run: |
          [ -f .env ] || sed "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env.example > .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Reject a request without a token
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/endorse/translate \
            -H 'Content-Type: application/json' -d @backend/tests/fixtures/rumbo-input.json)
          echo "status: $status"
          test "$status" = "401"
      - name: Match the PDF output exactly with a token
        run: |
          token=$(docker compose exec -T backend node dist/scripts/generate-token.js)
          curl -sf -o /tmp/output.json -X POST http://localhost:8080/api/v1/endorse/translate \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d @backend/tests/fixtures/rumbo-input.json
          node -e "
            const fs = require('fs');
            const actual = fs.readFileSync('/tmp/output.json', 'utf8');
            const expected = JSON.stringify(JSON.parse(fs.readFileSync('backend/tests/fixtures/rumbo-expected-output.json', 'utf8')));
            if (actual !== expected) { console.error(actual); process.exit(1); }
            console.log('Output matches the PDF exactly');
          "
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
